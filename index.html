$("main").innerHTML=(w?`<h3 class="sec">Add a teacher</h3><div class="row"><input id="t1" placeholder="ID (e.g. T9)"><input id="t2" placeholder="Name"><select id="t3">${RK.map(r=>`<option>${r}</option>`)}</select><input id="t4" type="date" title="Date of appointment"><input id="t5" placeholder="Subjects"><input id="t6" placeholder="Classes"><button class="b" onclick="addT()">Add teacher</button></div>`:"")+`<h3 class="sec">Class teachers</h3>`+T(["Class","Class teacher"],CL.map(c=>[c,w?`<select onchange="setCT(${c},this.value)"><option value="">— Not assigned —</option>${T1.map(t=>`<option value="${esc(t.id)}"${ct[c]==t.id?" selected":""}>${esc(t.name)} (${esc(t.id)})</option>`)}</select>`:esc((T1.find(t=>t.id==ct[c])||{}).name||"Not assigned")]))+`<h3 class="sec">Teachers</h3>`+T(["ID","Name","Rank","Appointed","Service","Subjects","Classes","Role",""],T1.map(t=>[esc(t.id),esc(t.name),esc(t.rank||""),fd(t.appointed),svc(t.appointed),esc(t.subjects||""),esc(t.classes||""),byT[t.id]?`<span class="tag" style="--c:var(--green)">Class teacher – Class ${byT[t.id]}</span>`:"Subject teacher",w?`<button class="b g" onclick="editT('${esc(t.id)}')">Edit</button> <button class="b" onclick="delT('${esc(t.id)}')">Delete</button>`:""]))}
function svc(d){if(!d)return"";const a=new Date(d),n=new Date();let m=(n.getFullYear()-a.getFullYear())*12+n.getMonth()-a.getMonth();if(n.getDate()<a.getDate())m--;return Math.floor(m/12)+" y "+m%12+" m"}
async function addT(){const id=$("t1").value.trim(),name=$("t2").value.trim();if(!id||!name)return bad("Teacher ID and name are required.");const{error}=await sb.from("teachers").insert({id,name,rank:$("t3").value,appointed:$("t4").value||null,subjects:$("t5").value,classes:$("t6").value});if(error)return bad(error.code=="23505"?"This teacher ID already exists.":why(error));toast("Teacher added.");teachers()}
async function editT(id){const{data:t,error}=await sb.from("teachers").select("*").eq("id",id).single();if(error)return bad(why(error));formModal("Edit teacher – "+id,[["name","Name"],["rank","Rank","select",RK],["appointed","Date of appointment","date"],["subjects","Subjects"],["classes","Classes"]],t,async r=>{if(!r.name.trim()){bad("Name is required.");return false}const{error}=await sb.from("teachers").update({name:r.name.trim(),rank:r.rank,appointed:r.appointed||null,subjects:r.subjects,classes:r.classes}).eq("id",id);if(error){bad(why(error));return false}toast("Teacher updated.");teachers()})}
function delT(id){modal("Delete teacher "+id+"? Their class teacher assignment is removed too.",async()=>{const{error}=await sb.from("teachers").delete().eq("id",id);if(error)return bad(why(error));toast("Teacher deleted.");teachers()},"Delete")}
async function setCT(c,t){if(!t){const{error}=await sb.from("class_teachers").delete().eq("class_no",c);if(error)return bad(why(error));toast("Class "+c+" now has no class teacher.");return teachers()}const{error}=await sb.from("class_teachers").upsert({class_no:c,teacher_id:t,assigned_on:iso()});if(error){bad(error.code=="23505"?"This teacher is already class teacher of another class. Unassign that class first.":why(error));return teachers()}toast("Class "+c+" class teacher saved.");teachers()}
/* users and roles (administrator) */
async function users(){const P=await run(sb.from("profiles").select("*").order("created_at"));if(!P)return;$("main").innerHTML=`<h3 class="sec">Users and roles</h3><div class="card pad"><b>To add a new person:</b><ol><li>In Supabase open <b>Authentication → Users → Add user → Create new user</b>, enter their email and a password, and tick <b>Auto Confirm User</b>.</li><li>Come back here and refresh. Their row appears below.</li><li>Choose their role. For a student type the GR number in <b>Link</b>, for a teacher type the teacher ID.</li></ol><small>Students without an email can be given a school address such as 101@students.ghs.</small></div><div style="height:12px"></div>`+T(["Name / email","Role","Link (GR or teacher ID)",""],P.map(p=>[`<input id="pn_${p.id}" value="${esc(p.full_name||"")}" style="width:100%">`,`<select id="pr_${p.id}"${p.id==ME.id?" disabled":""}>${["administrator","headmaster","teacher","student"].map(r=>`<option${r==p.role?" selected":""}>${r}</option>`).join("")}</select>`,`<input id="pf_${p.id}" value="${esc(p.ref||"")}" placeholder="GR or ID">`,`<button class="b" onclick="saveU('${p.id}')">Save</button>`]))}
async function saveU(id){const role=$("pr_"+id).value,ref=$("pf_"+id).value.trim();if(["student","teacher"].includes(role)&&!ref)return bad("Enter the GR number or teacher ID for this person.");const{error}=await sb.from("profiles").update({full_name:$("pn_"+id).value.trim(),role,ref:ref||null}).eq("id",id);if(error)return bad(why(error));toast("User saved.")}
init();
</script></body></html>
