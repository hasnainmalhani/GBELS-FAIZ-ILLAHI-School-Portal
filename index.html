function markText(t){const s=SL.find(x=>x.qr_data&&x.qr_data==t)||SL.find(x=>String(x.gr)==String(t).trim());if(!s){$("sr").innerHTML='<b style="color:var(--red)">Invalid or unregistered QR code.</b>';return}return markStudent(s)}
async function markStudent(s){const o=$("sr"),{data:r}=await sb.from("attendance").select("*").eq("kind","student").eq("person_ref",String(s.gr)).eq("att_date",iso()).maybeSingle();let x="Present",msg="";if(r){x=r.status;msg='<span class="tag" style="--c:var(--amber);color:#2B2724">Already marked today</span>'}else{const{error}=await sb.from("attendance").insert({person_ref:String(s.gr),kind:"student",att_date:iso(),arrival:nowT(),status:"Present",exit_time:"14:00"});if(error){if(error.code=="23505")msg='<span class="tag" style="--c:var(--amber);color:#2B2724">Already marked today</span>';else return bad(why(error))}}o.innerHTML=`<div class="row" style="align-items:center"><span class="av" style="width:56px;height:56px;border-radius:50%;background:var(--sand);color:var(--deep);display:grid;place-items:center;font-weight:700">${esc(s.name[0])}${esc((s.surname||"")[0]||"")}</span><div><b>${esc(s.name)} ${esc(s.surname||"")}</b><br>GR ${s.gr} · Class ${s.class_no}<br>${stt(x)} ${msg}</div></div>`;await refLog()}
async function simScan(){const v=$("sg").value.trim();if(v){const s=SL.find(x=>String(x.gr)==v);if(!s)return bad("No student with GR "+v+".");await markStudent(s);return toast("Simulated scan saved for "+s.name+" (test).")}const A=await run(sb.from("attendance").select("person_ref").eq("kind","student").eq("att_date",iso()).limit(5000)),done=new Set((A||[]).map(a=>String(a.person_ref))),s=SL.find(x=>!done.has(String(x.gr)));if(!s)return toast("All students are already marked today.");await markStudent(s);toast("Simulated scan saved for "+s.name+" (test).")}
function resetToday(){modal("Delete all of today’s student attendance records? (for testing)",async()=>{const{error}=await sb.from("attendance").delete().eq("kind","student").eq("att_date",iso());if(error)return bad(why(error));toast("Today’s attendance cleared.");refLog()},"Delete")}

init();
</script></body></html>
