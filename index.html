<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Playfair Display",serif;margin:0}
.card{background:var(--card);border-radius:16px}.pad{padding:18px}.w{overflow-x:auto;max-width:100%}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--deep),var(--brick))}
.login form,.login .box{background:var(--card);border-radius:20px;padding:32px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px #0004}
.login h1{font-size:26px;color:var(--brick)}.login small{color:var(--mute)}

.b{padding:10px 18px;border:0;border-radius:10px;background:var(--brick);color:#fff;cursor:pointer;font:inherit;font-size:14px}.b.g{background:var(--green)}.b:disabled{opacity:.6}
a.lk{color:var(--brick);cursor:pointer;font-size:14px;background:none;border:0;padding:0;text-align:left;font:inherit}
#shell{display:flex;min-height:100vh}
aside{width:230px;flex:none;background:linear-gradient(180deg,var(--brick),var(--deep) 55%,#2B2724);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;transition:transform .25s}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid #ffffff30;margin-bottom:10px}
.logo b{width:40px;height:40px;border-radius:50%;background:var(--sand);color:var(--deep);display:grid;place-items:center;font-family:Georgia,serif}.logo span{font-size:13px;line-height:1.25}
nav button{all:unset;box-sizing:border-box;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#ffe9d9;margin:2px 0;display:block}
nav button:hover{background:var(--card)fff1c}nav button.on{background:var(--sand);color:var(--deep);font-weight:600}nav button:focus-visible{outline:2px solid #fff}
main{flex:1;min-width:0;padding:0 22px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:3px solid var(--brick);flex-wrap:wrap}
header h2{font-size:21px;color:var(--brick)}header small{color:var(--mute)}.hm{text-align:right}.hm b{display:block}
.burger{display:none;font-size:22px;background:none;border:0}
.who{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin:10px 0;font-size:14px;color:var(--mute);flex-wrap:wrap}
.hero{border-radius:20px;background:linear-gradient(120deg,var(--deep),var(--brick));color:#fff;padding:26px;margin-top:6px}
.greet{display:flex;align-items:center;gap:10px;font-size:22px}.greet svg{width:36px;height:36px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.stat{background:var(--card);border-radius:16px;padding:18px;border-left:6px solid var(--c);box-shadow:0 2px 10px #7a362614}
.stat b{display:block;font-size:32px;font-family:Georgia,serif;color:var(--c)}.stat span{color:var(--mute);font-size:14px}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.dn{background:var(--card);border-radius:16px;padding:16px;text-align:center}
.ring{width:110px;height:110px;border-radius:50%;margin:6px auto 10px;background:conic-gradient(var(--green) 0 var(--p),var(--red) var(--p) var(--a),var(--amber) var(--a) 100%);display:grid;place-items:center}
.ring i{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:700}
h3.sec{margin:26px 0 12px;font-size:20px;color:var(--deep)}
table{width:100%;border-collapse:collapse;min-width:520px}
th{background:var(--brick);color:#fff;text-align:left;padding:10px 14px;font-weight:600;white-space:nowrap}td{padding:10px 14px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.tag{padding:2px 10px;border-radius:12px;color:#fff;font-size:12px;background:var(--c,var(--brick))}
@media (max-width:820px){aside{position:fixed;z-index:20;left:0;transform:translateX(-100%)}aside.open{transform:none}.burger{display:block}main{padding:0 14px 30px}.hm{text-align:left}}
[data-theme="dark"]{--bg:#1d1a18;--card:#2a2623;--ink:#f3e9df;--mute:#b5a79b;--line:#3d3631;color-scheme:dark}
[data-theme="dark"] h3.sec{color:var(--sand)}
th{text-align:start}[dir=rtl] .hm{text-align:left}[dir=rtl] .who{justify-content:flex-start}
.tick{background:var(--card);border-radius:16px;height:150px;overflow:hidden;border:1px solid var(--line)}

.hero{display:flex;align-items:stretch;padding:0;gap:0}.hero-t{padding:26px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0}
.hero-img{width:46%;max-width:540px;min-height:220px;object-fit:cover;object-position:center;display:block}
[dir=rtl] .hero{flex-direction:row-reverse}
@media (max-width:820px){.hero{flex-direction:column}.hero-img{width:100%;max-width:none;height:200px;min-height:0}}
.rc .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;max-width:430px;opacity:.12;pointer-events:none;z-index:0}
.rc::before{content:none}.rc.fb::before{content:"GHS";position:absolute;inset:0;display:grid;place-items:center;font:700 150px Georgia,serif;color:#a8523a1c;pointer-events:none}
.rc>*:not(.wm){position:relative;z-index:1}.rc-h{text-align:center;margin-bottom:8px}.rc-t{font:700 22px Georgia,serif;color:var(--brick)}
.rc-id{display:flex;gap:14px;align-items:center;margin:8px 0 12px}.rc table td,.rc table th{background:transparent}
.ms{width:100%;border-collapse:collapse;table-layout:fixed;min-width:0!important}.ms th,.ms td{border:1px solid var(--line);text-align:center;padding:8px 6px;vertical-align:middle}.ms th{background:var(--brick)!important;color:#fff}.ms .l{text-align:left;width:22%}.ms th{white-space:normal;font-size:12.5px;line-height:1.2;padding:6px 4px}
.mk{display:flex;flex-direction:column;align-items:center;line-height:1.15}.mk b{font-size:17px}.mk span{font-size:12px;color:var(--mute)}
.rc-sum,.rc-att{margin:10px 0 0}

@media print{@page{size:A4;margin:12mm}

const hero=()=>{const h=new Date().getHours();return`<div class="hero"><div class="hero-t"><div class="greet">${h>=5&&h<18?sun:moon}<span>${h<5?"Good Night":h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening"}, ${esc((ME.full_name||"").split(" ")[0]||ME.role)}</span></div><small>${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</small></div><img class="hero-img" src="${BLD}" alt="Government High School Umeed Ali Junejo building"></div>`};
const stat=(l,v,c)=>`<div class="stat" style="--c:${c}"><b>${v}</b><span>${l}</span></div>`;
async function dash0(){const td=iso();const[S,A,Tc]=await Promise.all([run(sb.from("students").select("gr,class_no,gender").eq("status","active").limit(5000)),run(sb.from("attendance").select("person_ref,status").eq("kind","student").eq("att_date",td).limit(5000)),sb.from("teachers").select("*",{count:"exact",head:true})]);if(!S)return;const cls={};S.forEach(s=>cls[s.gr]=s.class_no);const st={};(A||[]).forEach(a=>st[a.person_ref]=a.status);const g=S.filter(s=>s.gender=="Girl").length,pr=S.filter(s=>st[s.gr]=="Present").length;
const ring=CL.map(c=>{const L=S.filter(s=>s.class_no==c),n=L.length||1,p=L.filter(s=>st[s.gr]=="Present").length,l=L.filter(s=>st[s.gr]=="Leave").length,ab=L.length-p-l,pp=Math.round(p*100/n),aa=Math.round(ab*100/n);return`<div class="dn"><b>Class ${c}</b><div class="ring" style="--p:${pp}%;--a:${pp+aa}%"><i>${L.length?pp+"%":"—"}</i></div><small>Absent ${aa}% · Leave ${L.length?Math.max(0,100-pp-aa):0}%</small></div>`}).join("");
$("main").innerHTML=hero()+`<div class="stats">${stat("Total students",S.length,"var(--brick)")+stat("Girls",g,"#A0527A")+stat("Boys",S.length-g,"var(--deep)")+stat("Teachers",Tc.count||0,"var(--green)")+stat("Present today",pr,"#3F6F8F")+stat("Attendance",S.length?Math.round(pr*100/S.length)+"%":"—","#B8862B")}</div><h3 class="sec">Class-wise attendance today</h3><div class="donuts">${ring}</div><p style="color:var(--mute);margin-top:24px">Attendance, exams, leave, library and the other sections are added in the next steps.</p>`}
async function mine0(){const S=await run(sb.from("students").select("*").limit(1));if(!S)return;const s=S[0];$("main").innerHTML=hero()+(s?`<div class="card pad" style="margin-top:18px"><h3>${esc(s.name)} ${esc(s.surname||"")}</h3><p>GR ${esc(s.gr)} · Class ${esc(s.class_no)} · ${esc(s.gender||"")}<br>Father: ${esc(s.father_name||"—")} · Phone: ${esc(s.phone||"—")}<br>Date of birth: ${fd(s.dob)} · B-Form: ${esc(s.b_form||"—")} · Admitted: ${fd(s.admission_date)}</p></div>`:'<div class="card pad" style="margin-top:18px">Your login is not linked to a student record yet. Please ask the administrator.</div>')}
/* students */
const fields=()=>`${[["g0","GR no."],["n1","Name"],["n2","Surname"]].map(f=>`<input id="${f[0]}" placeholder="${f[1]}">`).join("")}<select id="n3">${CL.map(c=>`<option>${c}</option>`)}</select><select id="n4"><option>Girl</option><option>Boy</option></select><input id="n5" type="date" title="Date of birth"><input id="n6" placeholder="B-Form no."><input id="n7" placeholder="Father’s name"><input id="n8" placeholder="Phone"><input id="n9" type="date" title="Admission date">`;
const chk=r=>{if(!r.name.trim()||!r.father_name.trim())return"Name and father’s name are required.";if(r.b_form&&!/^\d{5}-?\d{7}-?\d$/.test(r.b_form))return"B-Form must be 13 digits.";if(r.phone&&!/^[0-9+\- ]{7,15}$/.test(r.phone))return"Enter a valid phone number.";return""};
let SQ="",SC="";
async function students(){const w=isHead(),S=await run(sb.from("students").select("*").eq("status","active").order("gr").limit(5000));if(!S)return;const q=SQ.toLowerCase(),L=S.filter(s=>(!SC||s.class_no==SC)&&(!q||(s.name+" "+(s.surname||"")+" "+(s.b_form||"")).toLowerCase().includes(q)||String(s.gr).includes(q)));
$("main").innerHTML=(w?`<h3 class="sec">Add a student</h3><div class="row">${fields()}<button class="b" onclick="addS()">Add student</button></div><small>Date of birth, then admission date</small>`:"")+`${w?'<div class="row"><button class="b g" onclick="promoView()">Promote students to next class</button><button class="b g" onclick="alumView()">Alumni</button></div>':""}<div class="row"><input id="sq" placeholder="Search name, GR or B-Form" value="${esc(SQ)}" onchange="SQ=this.value;students()"><select id="sc" onchange="SC=this.value;students()"><option value="">All classes</option>${CL.map(c=>`<option${SC==c?" selected":""}>${c}</option>`)}</select><b>${L.length} student(s)</b></div>`+T(["","GR","Name","Class","Gender","DOB","B-Form","Father","Phone","Admitted","Photo / QR","Profile",""],L.map(s=>[avatar(s,36),s.gr,esc(s.name)+" "+esc(s.surname||""),s.class_no,esc(s.gender||""),fd(s.dob),esc(s.b_form||""),esc(s.father_name||""),esc(s.phone||""),fd(s.admission_date),picBtns(s),`<button class="b" onclick="openProf(${s.gr})">Full profile</button>`,w?`<button class="b g" onclick="editS(${s.gr})">Edit</button> <button class="b" onclick="delS(${s.gr})">Delete</button>`:""]))}
async function addS(){const gr=parseInt($("g0").value);if(!gr)return bad("Enter the GR number.");const r={name:$("n1").value,father_name:$("n7").value,b_form:$("n6").value.trim(),phone:$("n8").value.trim()},m=chk(r);if(m)return bad(m);const{error}=await sb.from("students").insert({gr,name:r.name.trim(),surname:$("n2").value.trim()||null,class_no:+$("n3").value,gender:$("n4").value,dob:$("n5").value||null,b_form:r.b_form||null,father_name:r.father_name.trim(),phone:r.phone||null,admission_date:$("n9").value||iso()});if(error)return bad(error.code=="23505"?"This GR number already exists.":why(error));toast("Student added.");students()}
async function editS(g){const{data:s,error}=await sb.from("students").select("*").eq("gr",g).single();if(error)return bad(why(error));formModal("Edit student – GR "+g,[["name","Name"],["surname","Surname"],["class_no","Class","select",CL],["gender","Gender","select",["Girl","Boy"]],["dob","Date of birth","date"],["b_form","B-Form no."],["father_name","Father’s name"],["phone","Phone"],["admission_date","Admission date","date"]],s,async r=>{const m=chk(r);if(m){bad(m);return false}const{error}=await sb.from("students").update({name:r.name.trim(),surname:r.surname.trim()||null,class_no:+r.class_no,gender:r.gender,dob:r.dob||null,b_form:r.b_form||null,father_name:r.father_name.trim(),phone:r.phone||null,admission_date:r.admission_date||null}).eq("gr",g);if(error){bad(why(error));return false}toast("Student updated.");students()})}
function delS(g){modal("Delete student GR "+g+" permanently? Their marks, books and library records are deleted too.",async()=>{await sb.from("attendance").delete().eq("kind","student").eq("person_ref",String(g));const{error}=await sb.from("students").delete().eq("gr",g);if(error)return bad(why(error));toast("Student deleted.");students()},"Delete")}

async function teachers(){const w=isHead(),[T1,C1]=await Promise.all([run(sb.from("teachers").select("*").order("id")),run(sb.from("class_teachers").select("*"))]);if(!T1)return;const ct={};(C1||[]).forEach(c=>ct[c.class_no]=c.teacher_id);const byT={};(C1||[]).forEach(c=>byT[c.teacher_id]=c.class_no);
$("main").innerHTML=(w?`<h3 class="sec">Add a teacher</h3><div class="row"><input id="t1" placeholder="ID (e.g. T9)"><input id="t2" placeholder="Name"><select id="t3">${RK.map(r=>`<option>${r}</option>`)}</select><input id="t4" type="date" title="Date of appointment"><input id="t5" placeholder="Subjects"><input id="t6" placeholder="Classes"><button class="b" onclick="addT()">Add teacher</button></div>`:"")+`<h3 class="sec">Class teachers</h3>`+T(["Class","Class teacher"],CL.map(c=>[c,w?`<select onchange="setCT(${c},this.value)"><option value="">— Not assigned —</option>${T1.map(t=>`<option value="${esc(t.id)}"${ct[c]==t.id?" selected":""}>${esc(t.name)} (${esc(t.id)})</option>`)}</select>`:esc((T1.find(t=>t.id==ct[c])||{}).name||"Not assigned")]))+`<h3 class="sec">Teachers</h3>`+T(["","ID","Name","Rank","Appointed","Service","Subjects","Classes","Role","Photo",""],T1.map(t=>[avatar(t,36),esc(t.id),esc(t.name),esc(t.rank||""),fd(t.appointed),svc(t.appointed),esc(t.subjects||""),esc(t.classes||""),byT[t.id]?`<span class="tag" style="--c:var(--green)">Class teacher – Class ${byT[t.id]}</span>`:"Subject teacher",tPic(t),w?`<button class="b g" onclick="editT('${esc(t.id)}')">Edit</button> <button class="b" onclick="delT('${esc(t.id)}')">Delete</button>`:""]))}
function svc(d){if(!d)return"";const a=new Date(d),n=new Date();let m=(n.getFullYear()-a.getFullYear())*12+n.getMonth()-a.getMonth();if(n.getDate()<a.getDate())m--;return Math.floor(m/12)+" y "+m%12+" m"}
