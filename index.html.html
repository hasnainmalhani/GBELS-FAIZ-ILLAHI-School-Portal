<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GHS Umeed Ali Junejo – School Portal</title>
<style>
:root{--brick:#A8523A;--deep:#7A3626;--sand:#E8CDB0;--bg:#FBF5EE;--card:#fff;--ink:#2B2724;--mute:#6f635b;--green:#4F7A4A;--red:#C0392B;--amber:#E0A526;--line:#eadccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a18;--card:#2a2623;--ink:#f3e9df;--mute:#b5a79b;--line:#3d3631}}
:root[data-theme="dark"]{--bg:#1d1a18;--card:#2a2623;--ink:#f3e9df;--mute:#b5a79b;--line:#3d3631}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Playfair Display",serif;margin:0}
aside{width:240px;flex:none;background:linear-gradient(180deg,var(--brick),var(--deep) 55%,#2B2724);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;transition:transform .25s}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid #ffffff30;margin-bottom:10px}
.logo b{width:40px;height:40px;border-radius:50%;background:var(--sand);color:var(--deep);display:grid;place-items:center;font-family:Georgia,serif}
.logo span{font-size:13px;line-height:1.25}
nav button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;color:#ffe9d9;margin:2px 0}
nav button:hover{background:#ffffff1c}nav button.on{background:var(--sand);color:var(--deep);font-weight:600}
nav button:focus-visible{outline:2px solid #fff}
main{flex:1;min-width:0;padding:0 22px 30px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:3px solid var(--brick);flex-wrap:wrap}
header h2{font-size:21px;color:var(--brick)}header small{color:var(--mute)}
.burger{display:none;font-size:22px;background:none;border:0;color:var(--ink)}
.hm{text-align:right}.hm b{display:block}
.top{display:flex;gap:10px;margin:16px 0}
.top input{flex:1;padding:12px 16px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.top button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:30px;padding:0 16px;cursor:pointer}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);border-radius:20px;overflow:hidden;background:linear-gradient(120deg,var(--deep),var(--brick));color:#fff}
.hero img{width:100%;height:100%;min-height:220px;object-fit:cover;display:block}
.hero div{padding:26px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hero h1{font-size:30px}.greet{display:flex;align-items:center;gap:10px;font-size:20px;background:#ffffff22;padding:10px 16px;border-radius:14px;width:fit-content}
.greet svg{width:34px;height:34px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:20px 0}
.stat{background:var(--card);border-radius:16px;padding:18px;border-left:6px solid var(--c);box-shadow:0 2px 10px #7a362614}
.stat b{display:block;font-size:34px;font-family:Georgia,serif;color:var(--c)}.stat span{color:var(--mute);font-size:14px}
h3{margin:26px 0 12px;font-size:20px;color:var(--deep)}
:root[data-theme="dark"] h3{color:var(--sand)}
.donuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.dn{background:var(--card);border-radius:16px;padding:16px;text-align:center}
.ring{width:110px;height:110px;border-radius:50%;margin:6px auto 10px;background:conic-gradient(var(--green) 0 var(--p),var(--red) var(--p) var(--a),var(--amber) var(--a) 100%);display:grid;place-items:center}
.ring i{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:700}
.dn small{color:var(--mute);font-size:12px}
.legend{display:flex;gap:16px;font-size:13px;margin-top:10px;color:var(--mute)}.legend s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--c)}
.cal{background:var(--card);border-radius:16px;overflow:hidden}.cal .w{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th{background:var(--brick);color:#fff;text-align:left;padding:10px 14px;font-weight:600}
td{padding:10px 14px;border-bottom:1px solid var(--line)}td[contenteditable]:focus{outline:2px solid var(--brick);background:#a8523a14}
tr.ev td{background:#4f7a4a14}
.cal button{margin:12px;padding:8px 16px;border-radius:20px;border:0;background:var(--green);color:#fff;cursor:pointer}
.tick{background:var(--card);border-radius:16px;height:150px;overflow:hidden;position:relative;border:1px solid var(--line)}
.tick ul{list-style:none;margin:0;padding:0;animation:up 14s linear infinite}.tick:hover ul{animation-play-state:paused}
.tick li{padding:14px 20px;border-bottom:1px solid var(--line);height:50px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tick li b{color:var(--brick)}
@keyframes up{from{transform:translateY(0)}to{transform:translateY(-250px)}}
@media (prefers-reduced-motion:reduce){.tick ul{animation:none}}
.soon{background:var(--card);border-radius:16px;padding:40px;text-align:center;margin-top:20px}
@media (max-width:820px){aside{position:fixed;z-index:20;left:0;transform:translateX(-100%)}aside.open{transform:none}.burger{display:block}.hero{grid-template-columns:1fr}main{padding:0 14px 24px}.hm{text-align:left}}
.card{background:var(--card);border-radius:16px}.pad{padding:18px}.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:20px}.bar h3{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row input,.row select,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.b{padding:9px 16px;border:0;border-radius:10px;background:var(--brick);color:#fff;cursor:pointer;font:inherit;font-size:13px}.b.g{background:var(--green)}.av{width:34px;height:34px;border-radius:50%;background:var(--sand);color:var(--deep);display:inline-grid;place-items:center;font-weight:700;font-size:13px}.tag{padding:2px 10px;border-radius:12px;color:#fff;font-size:12px;background:var(--c)}
.rc{position:relative;padding:22px;background:#fff;color:#2B2724;border:2px solid var(--brick);border-radius:12px;margin-top:14px;overflow:hidden}.rc::before{content:"GHS";position:absolute;inset:0;display:grid;place-items:center;font:700 150px Georgia,serif;color:#a8523a1c;pointer-events:none}.rc table{min-width:0}.rc td{border-color:#eadccb}.tt td{min-width:105px;font-size:12px}#mod h3{margin:0}#mod p{margin:8px 0}
.w{overflow-x:auto;max-width:100%}.top{flex-wrap:wrap}.top input{min-width:0;flex:1 1 200px}.tick ul{animation-name:up2}@keyframes up2{from{transform:none}to{transform:translateY(var(--h,-250px))}}
@media print{aside,header,.top,.noprint,.bar,.burger{display:none!important}body{display:block}#dash{display:none}main{padding:0}}
